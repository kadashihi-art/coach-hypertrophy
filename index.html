<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Hypertrophy - Treino de Hipertrofia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏋️ Coach Hypertrophy</h1>
            <p>Seu plano de treino de hipertrofia</p>
        </header>

        <main>
            <section class="exercise-section">
                <h2>📋 Exercícios</h2>
                <div id="exercises-list" class="exercises-list"></div>
            </section>

            <section class="workout-section">
                <h2>💪 Seu Treino</h2>
                <div id="workout-display" class="workout-display"></div>
            </section>

            <section class="stats-section">
                <h2>📊 Progresso</h2>
                <div id="stats" class="stats"></div>
            </section>

            <section class="tips-section">
                <h2>💡 Dicas</h2>
                <ul id="tips-list" class="tips-list"></ul>
            </section>
        </main>

        <footer>
            <p>© 2026 Coach Hypertrophy - Treine com propósito!</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
